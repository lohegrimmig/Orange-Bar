[package]
name = "orange_bar_agent_station"
edition = "2024"
published-at = "0x0" # nach Publish hier + unten unter [addresses] eintragen

[dependencies]
# rev folgt dem Netzwerk, gegen das gebaut/deployed wird: "framework/testnet"
# (Standard hier, für den Testnet-Pilot aus docs/AGENT_STATION_ONCHAIN.md § 8),
# "framework/devnet" oder "framework/mainnet". Mit diesem Wert tatsächlich
# gebaut und getestet (iota-move build/test, 0 Fehler, 6/6 Tests) mit einem
# aus iotaledger/iota Tag v1.27.0 selbst gebauten iota-move-Binary – siehe
# docs/AGENT_STATION_ONCHAIN.md § 12 für den vollständigen Build-Weg.
Iota = { git = "https://github.com/iotaledger/iota.git", subdir = "crates/iota-framework/packages/iota-framework", rev = "framework/testnet" }

[addresses]
orange_bar = "0x0" # Platzhalter bis zum ersten Publish je Netzwerk
